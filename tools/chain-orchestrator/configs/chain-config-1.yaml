name: "Initial Access → Credential Theft → Persistence"
version: "1.0.0"
description: "Multi-stage chain from DDE document delivery to credential harvesting to persistence establishment"
category: "credential-theft"
disclaimer: "Educational and research use only. Use only in authorized environments."

stages:
  - name: "DDE Document Delivery"
    type: "initial_access"
    description: "Send DDE-enabled CSV or Excel file via spear-phishing email"
    mitre_technique: "T1566.001"
    payload: "DDE based social engineering csv payload/Estates_ePIMS_2016.csv"
    detection: "Email attachment analysis, CSV with DDE formulas"
    mitigation: "Block DDE via Group Policy, Protected View enforcement"

  - name: "DDE Execution"
    type: "execution"
    description: "Target opens document and DDE fields execute command"
    mitre_technique: "T1204.002"
    payload: "calc.exe"
    detection: "EXCEL.EXE spawning cmd.exe or powershell.exe"
    mitigation: "Disable DDE: HKCU\\Software\\Microsoft\\Office\\<ver>\\Excel\\Security\\AllowDDE=0"

  - name: "Credential Harvester Deployment"
    type: "collection"
    description: "Download and display fake Microsoft login page to capture credentials"
    mitre_technique: "T1056.003"
    payload: "Steal credentials using fake excel doc/excel/excel.html"
    detection: "Network connection from Office process, unusual HTTP POST"
    mitigation: "MFA deployment, credential submission monitoring"

  - name: "Validate Credentials"
    type: "defense_evasion"
    description: "Automatically test captured credentials against OWA/O365"
    mitre_technique: "T1078"
    payload: "enhanced-payloads/credential-validation/"
    detection: "Multiple login attempts from unusual source IPs"
    mitigation: "Conditional Access policies, login velocity limits"

  - name: "Persistence via Scheduled Task"
    type: "persistence"
    description: "Create scheduled task for persistent access"
    mitre_technique: "T1053.005"
    payload: "schtasks /create /tn 'WindowsUpdate' /tr 'calc.exe' /sc daily"
    detection: "Windows Event ID 4698 (Scheduled Task Created)"
    mitigation: "Monitor scheduled task creation, restrict schtasks.exe"
