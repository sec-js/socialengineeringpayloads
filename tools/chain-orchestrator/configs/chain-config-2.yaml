name: "Email Phishing Multi-Format Fallback"
version: "1.0.0"
description: "Multiple attachment formats in single email as fallback delivery — if one is blocked, others serve as backup"
category: "initial-access"
disclaimer: "Educational and research use only."

stages:
  - name: "Multi-Format Email Preparation"
    type: "resource_development"
    description: "Prepare multiple DDE payload formats (CSV, XLS, DOCX, SLK, MSG)"
    mitre_technique: "T1608"
    payload: "All DDE payload directories"
    detection: "N/A (preparation stage)"
    mitigation: "N/A"

  - name: "Email Delivery with Multiple Attachments"
    type: "initial_access"
    description: "Send phishing email with multiple attachment formats and a backup link"
    mitre_technique: "T1566.001"
    payload: "Multi-attachment phishing email"
    detection: "Email with multiple suspicious attachment types, outbound email analysis"
    mitigation: "Block macro-enabled files at email gateway"

  - name: "Format-Specific DDE Execution"
    type: "execution"
    description: "Whichever format the target opens, DDE executes"
    mitre_technique: "T1204.002"
    payload: "calc.exe via DDE in any format"
    detection: "Office application spawning cmd.exe"
    mitigation: "Disable DDE across all Office applications via Group Policy"

  - name: "Fallback: Malicious Link"
    type: "initial_access"
    description: "If all attachments blocked, link in email body redirects to phishing page"
    mitre_technique: "T1566.002"
    payload: "Link manipulation attack/linkmanipulation/"
    detection: "URL reputation analysis, domain registration age"
    mitigation: "Safe Links re-scan, URL filtering"

  - name: "Credential Capture via Tabnabbing"
    type: "collection"
    description: "Tabnabbing on opened link steals credentials"
    mitre_technique: "T1185"
    payload: "Tabnabbing attack/incident/"
    detection: "JavaScript page replacement, browser telemetry"
    mitigation: "Use password manager (won't fill on wrong domain)"
