name: "Multi-Layer Social Engineering Chain"
version: "1.0.0"
description: "Coordinated multi-channel attack combining vishing, email, and SMS"
category: "multi-channel"
disclaimer: "Educational and research use only."

stages:
  - name: "LinkedIn Trust Building"
    type: "reconnaissance"
    description: "Establish fake IT support persona on LinkedIn, connect with targets"
    mitre_technique: "T1598"
    payload: "Social engineering / OSINT"
    detection: "N/A (long-term preparation)"
    mitigation: "Employee training on social media vetting"

  - name: "Vishing Call"
    type: "initial_access"
    description: "Phone call from fake IT support warning of account threat"
    mitre_technique: "T1598.004"
    payload: "Voice phishing script"
    detection: "Unusual help desk call patterns, caller ID spoofing"
    mitigation: "Out-of-band IT support verification procedures"

  - name: "Spear-Phishing Email"
    type: "initial_access"
    description: "Follow-up email referencing phone call, containing malicious attachment"
    mitre_technique: "T1566.001"
    payload: "Password protected document/Confidential.docx"
    detection: "Email referencing prior phone contact (social engineering indicator)"
    mitigation: "Email security gateway, user reporting procedures"

  - name: "DDE Payload Execution"
    type: "execution"
    description: "Target opens password-protected document, DDE executes"
    mitre_technique: "T1204.002"
    payload: "calc.exe (PoC)"
    detection: "Office spawning child processes"
    mitigation: "Disable DDE, Protected View enforcement"

  - name: "SMS Reassurance"
    type: "defense_evasion"
    description: "SMS sent saying verification successful (builds trust, reduces suspicion)"
    mitre_technique: "T1036"
    payload: "SMS message"
    detection: "N/A (hard to detect)"
    mitigation: "Multi-channel verification skepticism training"
