name: "Credential Harvesting → Impersonation → Lateral Movement"
version: "1.0.0"
description: "Credential theft via multiple methods, validation, and use for lateral movement"
category: "credential-based"
disclaimer: "Educational and research use only."

stages:
  - name: "OSINT Reconnaissance"
    type: "reconnaissance"
    description: "Identify target employees via LinkedIn, company website, email headers"
    mitre_technique: "T1598"
    payload: "Public OSINT sources"
    detection: "N/A (passive reconnaissance)"
    mitigation: "Limit public information, train employees on social media exposure"

  - name: "Multi-Method Credential Harvest"
    type: "collection"
    description: "Simultaneously deploy fake Excel login and Basic Auth Word document"
    mitre_technique: "T1056.003"
    payload: "Steal credentials using fake excel doc/ + Steal credential using word doc/"
    detection: "Unusual form submissions, NTLM to external IPs"
    mitigation: "MFA, block outbound SMB, credential submission monitoring"

  - name: "Tabnabbing Credential Backup"
    type: "collection"
    description: "Tabnabbing as additional credential collection channel"
    mitre_technique: "T1185"
    payload: "Tabnabbing attack/incident/"
    detection: "JavaScript DOM manipulation in browser"
    mitigation: "Password managers (won't fill on wrong domain)"

  - name: "Credential Validation"
    type: "defense_evasion"
    description: "Validate captured credentials against accessible services"
    mitre_technique: "T1078"
    payload: "enhanced-payloads/credential-validation/"
    detection: "Login attempts from unusual IPs or times"
    mitigation: "Conditional Access, impossible travel detection"

  - name: "Lateral Movement via Internal Phishing"
    type: "lateral_movement"
    description: "Use compromised account to send internal phishing emails"
    mitre_technique: "T1534"
    payload: "Internal email with DDE payload"
    detection: "Unusual internal email sending patterns (UEBA)"
    mitigation: "Analyze internal email content, UEBA for email anomalies"
