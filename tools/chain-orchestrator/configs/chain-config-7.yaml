name: "Browser-Based Persistent Foothold Chain"
version: "1.0.0"
description: "Web-based attacks leading to persistent browser extension for long-term credential access"
category: "browser-based"
disclaimer: "Educational and research use only."

stages:
  - name: "Initial Browser Compromise"
    type: "initial_access"
    description: "Link manipulation or tabnabbing establishes initial foothold in browser session"
    mitre_technique: "T1566.002"
    payload: "Tabnabbing attack/ or Link manipulation attack/"
    detection: "URL reputation, domain analysis"
    mitigation: "URL scanning, user training on link verification"

  - name: "Extension Installation Social Engineering"
    type: "execution"
    description: "User tricked into installing malicious browser extension"
    mitre_technique: "T1204.001"
    payload: "emerging-payloads/browser-extension-injection/manifest.json"
    detection: "New browser extension installation"
    mitigation: "Enterprise browser policy: restrict non-whitelisted extensions"

  - name: "Browser Persistence Established"
    type: "persistence"
    description: "Extension persists across browser restarts, sessions, and password changes"
    mitre_technique: "T1176"
    payload: "Malicious browser extension"
    detection: "Extension making unusual network connections"
    mitigation: "Regular browser extension audits, enterprise management"

  - name: "Credential Collection"
    type: "collection"
    description: "Extension intercepts form submissions and session cookies"
    mitre_technique: "T1539"
    payload: "JavaScript form interceptor"
    detection: "Browser process unusual network activity"
    mitigation: "Content Security Policy on web applications"

  - name: "Exfiltration via Extension"
    type: "exfiltration"
    description: "Extension silently exfiltrates collected credentials to C2"
    mitre_technique: "T1041"
    payload: "Extension background.js exfiltration"
    detection: "Network connections from browser extension"
    mitigation: "Browser isolation, network monitoring"
