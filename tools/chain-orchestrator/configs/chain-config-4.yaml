name: "Office Macro Cascade Chain"
version: "1.0.0"
description: "Layered Office macro execution using password-protected delivery for email scanning bypass"
category: "macro-based"
disclaimer: "Educational and research use only."

stages:
  - name: "Password-Protected Delivery"
    type: "defense_evasion"
    description: "Password-protected DOCX bypasses email content scanning"
    mitre_technique: "T1027"
    payload: "Password protected document/Confidential.docx"
    detection: "Password-protected file heuristics, password in email body"
    mitigation: "Alert on password-protected attachments from external senders"

  - name: "Stage 1 Macro Loader"
    type: "execution"
    description: "Minimal macro downloads Stage 2 only (small footprint)"
    mitre_technique: "T1059.005"
    payload: "calc.exe (PoC)"
    detection: "WINWORD.EXE making outbound network connection"
    mitigation: "Block Office from making outbound connections"

  - name: "Stage 2 Macro Download"
    type: "command_and_control"
    description: "Stage 2 full payload macro retrieved from C2"
    mitre_technique: "T1105"
    payload: "Remote malicious template"
    detection: "Network connection from Office to external URL"
    mitigation: "Network monitoring, ASR rules for Office"

  - name: "Stage 2 Execution"
    type: "execution"
    description: "Full macro executes, disables security, creates persistence"
    mitre_technique: "T1059.005"
    payload: "calc.exe (PoC)"
    detection: "WINWORD.EXE spawning child processes, registry modifications"
    mitigation: "AMSI for Office VBA, P-code analysis tools"

  - name: "Persistence"
    type: "persistence"
    description: "Registry run key or scheduled task for persistence"
    mitre_technique: "T1547.001"
    payload: "Registry run key: HKCU\\...\\Run"
    detection: "Registry modification events (Sysmon Event ID 12, 13)"
    mitigation: "Registry auditing, run key monitoring"
