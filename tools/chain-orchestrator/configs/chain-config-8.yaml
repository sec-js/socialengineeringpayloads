name: "Repository-Based Supply Chain Attack"
version: "1.0.0"
description: "Compromise software package repository to deliver payloads to downstream consumers"
category: "supply-chain"
disclaimer: "Educational and research use only."

stages:
  - name: "Package Reconnaissance"
    type: "reconnaissance"
    description: "Identify popular packages with weak maintainer security or internal packages"
    mitre_technique: "T1592"
    payload: "OSINT on package repositories"
    detection: "N/A (passive reconnaissance)"
    mitigation: "Package signing, maintainer account MFA"

  - name: "Package Compromise"
    type: "initial_access"
    description: "Typosquatting, maintainer account takeover, or dependency confusion"
    mitre_technique: "T1195.001"
    payload: "emerging-payloads/supply-chain-npm-nuget/"
    detection: "Package integrity verification failure"
    mitigation: "Use package lock files with hashes, private registries"

  - name: "Payload Execution via Install Script"
    type: "execution"
    description: "preinstall/postinstall script executes when package installed"
    mitre_technique: "T1059.007"
    payload: "emerging-payloads/supply-chain-npm-nuget/malicious-package-template/index.js"
    detection: "npm install making network connections"
    mitigation: "SCA scanning, inspect package.json scripts before install"

  - name: "Credential and Secret Exfiltration"
    type: "collection"
    description: "Harvest environment variables, SSH keys, cloud credentials"
    mitre_technique: "T1552"
    payload: "Environment variable enumeration"
    detection: "CI/CD process accessing unexpected files or env vars"
    mitigation: "Secret scanning in CI/CD, restrict env var access"

  - name: "Widespread Impact"
    type: "exfiltration"
    description: "Secrets exfiltrated from all consumers of the compromised package"
    mitre_technique: "T1020"
    payload: "HTTPS exfiltration to C2"
    detection: "Mass credential abuse from multiple sources"
    mitigation: "Rotate all secrets after supply chain incident, incident response"
